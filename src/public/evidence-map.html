
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeviceGuard Evidence Intelligence Map</title>

  <!-- LEAFLET -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    .popup-container {
      width: 220px;
    }

    .popup-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
    }

    .popup-info {
      font-size: 14px;
      margin-bottom: 6px;
      color: #333;
    }

    .popup-img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      border: 2px solid #ddd;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 16px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- LEAFLET JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // ================= MAP =================

  const map = L.map("map").setView(
    [-1.286389, 36.817223],
    12
  );

  // ================= TILES =================

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);

  // ================= ICONS =================

  const cameraIcon = L.icon({
    iconUrl:
      "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",

    iconSize: [38, 38],
    iconAnchor: [19, 38]
  });

  const screenshotIcon = L.icon({
    iconUrl:
      "https://maps.google.com/mapfiles/ms/icons/purple-dot.png",

    iconSize: [38, 38],
    iconAnchor: [19, 38]
  });

  // ================= FETCH EVIDENCE =================

  fetch("/api/evidence/map")

    .then((res) => {
      if (!res.ok) {
        throw new Error(
          `Evidence request failed: HTTP ${res.status}`
        );
      }

      return res.json();
    })

    .then((data) => {

      console.log("Evidence map data:", data);

      if (!Array.isArray(data)) {
        throw new Error("Invalid evidence response");
      }

      if (!data.length) {
        alert("No evidence locations found.");
        return;
      }

      const bounds = [];

      data.forEach((p) => {

        if (
          p.latitude == null ||
          p.longitude == null
        ) {
          return;
        }

        const latitude = Number(p.latitude);
        const longitude = Number(p.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {
          return;
        }

        bounds.push([latitude, longitude]);

        // ================= ICON TYPE =================

        const selectedIcon =
          p.type === "camera"
            ? cameraIcon
            : screenshotIcon;

        // ================= IMAGE URL =================

        // Uses the same server that hosts this page.
        const imageUrl =
          `/uploads/evidence/${encodeURIComponent(p.file_path)}`;

        // ================= POPUP =================

        const popup = `

          <div class="popup-container">

            <div class="popup-title">
              Device Evidence
            </div>

            <div class="popup-info">
              <b>Type:</b> ${p.type || "Evidence"}
            </div>

            <div class="popup-info">
              <b>Machine:</b><br>
              ${p.machine_id}
            </div>

            <div class="popup-info">
              <b>Captured:</b><br>
              ${new Date(p.created_at).toLocaleString()}
            </div>

            <img
              src="${imageUrl}"
              class="popup-img"
              alt="Device evidence"
              loading="lazy"
              onerror="this.style.display='none'"
            />

          </div>

        `;

        // ================= MARKER =================

        L.marker(
          [latitude, longitude],
          { icon: selectedIcon }
        )
          .addTo(map)
          .bindPopup(popup);

      });

      // ================= AUTO FIT =================

      if (bounds.length > 0) {
        map.fitBounds(bounds, {
          padding: [50, 50]
        });
      }

    })

    .catch((err) => {

      console.error(
        "Evidence map error:",
        err
      );

      alert(
        "Unable to load evidence locations. Please try again."
      );

    });

</script>

</body>
</html>
