
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeviceGuard Evidence Intelligence Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    #map-status {
      position: absolute;
      z-index: 1000;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 90%;
      text-align: center;
    }

    .popup-container {
      width: 220px;
    }

    .popup-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
    }

    .popup-info {
      font-size: 14px;
      margin-bottom: 6px;
      color: #333;
      overflow-wrap: anywhere;
    }

    .popup-img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      border: 2px solid #ddd;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 16px;
    }
  </style>
</head>

<body>

<div id="map"></div>
<div id="map-status">Waiting for secure authentication...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // ================= MAP =================

  const map = L.map("map").setView(
    [-1.286389, 36.817223],
    12
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);

  // ================= ICONS =================

  const cameraIcon = L.icon({
    iconUrl:
      "https://maps.google.com/mapfiles/ms/icons/blue-dot.png",
    iconSize: [38, 38],
    iconAnchor: [19, 38]
  });

  const screenshotIcon = L.icon({
    iconUrl:
      "https://maps.google.com/mapfiles/ms/icons/purple-dot.png",
    iconSize: [38, 38],
    iconAnchor: [19, 38]
  });

  const statusElement = document.getElementById("map-status");

  function setStatus(message) {
    statusElement.textContent = message;
  }

  // ================= SAFE HTML =================

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => {
      const entities = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };

      return entities[character];
    });
  }

  // ================= LOAD EVIDENCE =================

  async function loadEvidence(token) {
    try {
      setStatus("Loading evidence locations...");

      const response = await fetch("/api/evidence/map", {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/json"
        }
      });

      if (response.status === 401) {
        throw new Error("Your session has expired. Please log in again.");
      }

      if (response.status === 403) {
        throw new Error("You are not authorized to view this evidence.");
      }

      if (!response.ok) {
        throw new Error(
          `Evidence request failed: HTTP ${response.status}`
        );
      }

      const data = await response.json();

      console.log("Evidence map data:", data);

      if (!Array.isArray(data)) {
        throw new Error("Invalid evidence response.");
      }

      if (data.length === 0) {
        setStatus("No evidence locations found.");
        return;
      }

      const bounds = [];
      let markerCount = 0;

      data.forEach(item => {
        if (
          item.latitude == null ||
          item.longitude == null
        ) {
          return;
        }

        const latitude = Number(item.latitude);
        const longitude = Number(item.longitude);

        if (
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude) ||
          latitude < -90 ||
          latitude > 90 ||
          longitude < -180 ||
          longitude > 180
        ) {
          return;
        }

        bounds.push([latitude, longitude]);

        const evidenceType = String(
          item.type || "evidence"
        ).toLowerCase();

        const selectedIcon =
          evidenceType === "camera"
            ? cameraIcon
            : screenshotIcon;

        // Use the temporary signed URL returned by the backend.
        const imageUrl =
          typeof item.image_url === "string" &&
          item.image_url.startsWith("https://")
            ? item.image_url
            : null;

        const popup = document.createElement("div");
        popup.className = "popup-container";

        const title = document.createElement("div");
        title.className = "popup-title";
        title.textContent = "Device Evidence";

        const type = document.createElement("div");
        type.className = "popup-info";
        type.textContent = "Type: " + evidenceType;

        const machine = document.createElement("div");
        machine.className = "popup-info";
        machine.textContent = "Machine: " + (item.machine_id || "Unknown");

        const captured = document.createElement("div");
        captured.className = "popup-info";

        const date = new Date(item.created_at);

        captured.textContent =
          "Captured: " +
          (
            Number.isNaN(date.getTime())
              ? "Unknown"
              : date.toLocaleString()
          );

        popup.appendChild(title);
        popup.appendChild(type);
        popup.appendChild(machine);
        popup.appendChild(captured);

        if (imageUrl) {
          const image = document.createElement("img");

          image.src = imageUrl;
          image.alt = "Device evidence";
          image.className = "popup-img";
          image.loading = "lazy";

          image.onerror = () => {
            image.style.display = "none";
          };

          popup.appendChild(image);
        }

        L.marker(
          [latitude, longitude],
          { icon: selectedIcon }
        )
          .addTo(map)
          .bindPopup(popup);

        markerCount++;
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, {
          padding: [50, 50]
        });
      }

      setStatus(
        markerCount > 0
          ? `${markerCount} evidence location(s) loaded`
          : "No valid evidence coordinates found."
      );

      if (markerCount > 0) {
        setTimeout(() => {
          statusElement.style.display = "none";
        }, 4000);
      }

    } catch (error) {
      console.error("Evidence map error:", error);
      setStatus(error.message || "Unable to load evidence locations.");
    }
  }

  // ================= SECURE TOKEN HANDOFF =================

  let authenticationReceived = false;

  // Only accept the token from the window that opened this page.
  window.addEventListener("message", event => {
    if (event.source !== window.opener) {
      return;
    }

    if (
      !event.data ||
      event.data.type !== "DEVICEGUARD_MAP_AUTH"
    ) {
      return;
    }

    if (authenticationReceived) {
      return;
    }

    const token = event.data.token;

    if (
      typeof token !== "string" ||
      !token.trim()
    ) {
      setStatus("Invalid authentication. Please log in again.");
      return;
    }

    authenticationReceived = true;

    loadEvidence(token);
  });

  // Tell the opening React page that the map is ready.
  if (window.opener) {
    window.opener.postMessage(
      { type: "DEVICEGUARD_MAP_READY" },
      "*"
    );
  } else {
    setStatus("Open this map from your DeviceGuard dashboard.");
  }

  // Avoid waiting forever if the opening page does not respond.
  setTimeout(() => {
    if (!authenticationReceived && window.opener) {
      setStatus("Authentication timed out. Close this page and try again.");
    }
  }, 15000);

</script>

</body>
</html>
